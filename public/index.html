<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>Feature-Umfrage</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="steps" aria-hidden="true">
        <span class="dot active" data-step="sort"></span>
        <span class="dot" data-step="details"></span>
        <span class="dot" data-step="done"></span>
      </div>
      <button id="langBtn" class="lang-btn" type="button" aria-label="Sprache wechseln">EN</button>
    </header>

    <!-- Schritt 1: Sortieren -->
    <section id="step-sort" class="step narrow">
      <div class="hero">
        <h1 id="title"></h1>
        <p id="intro" class="intro"></p>
        <p class="howto" id="howto" data-i18n="howto"></p>
      </div>

      <div id="list" class="list" aria-describedby="howto"></div>

      <form id="ideaForm" class="add-idea" autocomplete="off">
        <label for="ideaInput" data-i18n="ideaLabel"></label>
        <div class="add-row">
          <input id="ideaInput" type="text" maxlength="140" data-i18n-placeholder="ideaPlaceholder">
          <button type="submit" class="btn small" data-i18n="add"></button>
        </div>
        <p id="ideaHint" class="idea-hint" hidden></p>
      </form>

      <div class="actionbar">
        <div class="progress">
          <div class="progress-track" id="progressFill"><i class="pw"></i><i class="pn"></i><i class="px"></i></div>
          <span id="progressText"></span>
        </div>
        <button id="toDetails" class="btn primary" type="button" data-i18n="next"></button>
      </div>
    </section>

    <!-- Schritt 2: optionale Angaben -->
    <section id="step-details" class="step narrow" hidden>
      <div class="hero">
        <h1 data-i18n="detailsTitle"></h1>
        <p class="intro" data-i18n="detailsIntro"></p>
      </div>
      <div class="summary" id="summary"></div>
      <form id="detailsForm" class="details-form" novalidate>
        <label>
          <span data-i18n="name"></span>
          <input id="nameInput" type="text" maxlength="80" autocomplete="name">
        </label>
        <label>
          <span data-i18n="email"></span>
          <input id="emailInput" type="email" maxlength="120" autocomplete="email" inputmode="email">
          <small class="error" id="emailError" hidden data-i18n="emailInvalid"></small>
        </label>
        <p class="privacy" id="privacy"></p>
        <p class="error" id="submitError" hidden></p>
        <div class="form-actions">
          <button type="button" class="btn ghost" id="backBtn" data-i18n="back"></button>
          <button type="submit" class="btn primary" id="submitBtn" data-i18n="submit"></button>
        </div>
      </form>
    </section>

    <!-- Schritt 3: Danke + TestFlight -->
    <section id="step-done" class="step narrow done" hidden>
      <div class="confetti" aria-hidden="true">🎉</div>
      <h1 data-i18n="thanks"></h1>
      <p class="intro" id="tfText"></p>
      <a id="tfLink" class="btn primary big" href="#" rel="noopener" target="_blank">
        <span class="tf-icon" aria-hidden="true">✈️</span>
        <span data-i18n="tfButton"></span>
      </a>
      <p class="tf-url" id="tfUrl"></p>
      <button type="button" class="btn ghost small" id="againBtn" data-i18n="again"></button>
    </section>
  </main>

  <!-- Aktions-Sheet für Tippen statt Ziehen -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-grip" aria-hidden="true"></div>
      <h3 id="sheetTitle"></h3>
      <p id="sheetDesc" class="sheet-desc"></p>
      <div class="sheet-moves">
        <button type="button" class="move move-want" data-move="want">🔥 <span data-i18n="want"></span></button>
        <button type="button" class="move move-nice" data-move="nice">✨ <span data-i18n="nice"></span></button>
        <button type="button" class="move move-no" data-move="no">💤 <span data-i18n="no"></span></button>
      </div>
      <div class="sheet-order">
        <button type="button" class="btn ghost" data-order="top" data-i18n="toTop"></button>
        <button type="button" class="btn ghost" data-order="up" aria-label="hoch">↑</button>
        <button type="button" class="btn ghost" data-order="down" aria-label="runter">↓</button>
      </div>
      <button type="button" class="btn danger ghost" data-delete hidden data-i18n="delete"></button>
      <button type="button" class="btn ghost close" data-close data-i18n="close"></button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/vendor/Sortable.min.js"></script>
  <script src="/survey.js"></script>
</body>
</html>
